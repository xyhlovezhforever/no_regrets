[package]
name = "you-have-no-regrets-backend"
version = "1.0.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "情绪价值小程序后端 API"

[dependencies]
# Web 框架
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "timeout"] }
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", features = ["sink"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 数据库
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "chrono",
    "uuid",
    "migrate",
] }

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "aio"] }

# 密码加密
bcrypt = "0.15"

# JWT
jsonwebtoken = "9.2"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 配置管理
config = "0.14"
dotenvy = "0.15"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.7", features = ["v4", "serde"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# HTTP 客户端 (用于调用第三方 API)
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# 验证器
validator = { version = "0.16", features = ["derive"] }

# API 文档
utoipa = { version = "4.2", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

# 图像处理
image = { version = "0.24", features = ["png", "jpeg"] }
imageproc = "0.23"

[dev-dependencies]
mockall = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

